# Dashboard configuration for Pages CMS (app.pagescms.org).
# Defines what you see and can edit in the web dashboard. Saving in the
# dashboard commits to this repo, which triggers the build-and-deploy Action.

media:
  input: assets/images
  output: assets/images

content:
  # ---------------------------------------------------------------
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{fields.slug}.json"
    format: json
    view:
      # Position and visibility on the list itself, so the timeline order can
      # be read and fixed without opening each project.
      fields: [title, year, order, published]
      primary: title
      sort: [order, title, year]
    fields:
      - name: title
        label: Project name
        type: string
        required: true
        description: "Shown on the timeline, at the top of the project page, and in the browser tab."

      - name: published
        label: Show on site
        type: boolean
        default: true
        description: Turn off to hide this project completely — no card, no page. Nothing else breaks; the previous/next links skip it automatically.

      - name: slug
        label: URL name
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Lowercase letters, numbers and hyphens only — for example "riverside-pavilion".
        description: Becomes the page address. Avoid changing it once you've shared a link to the project.

      - name: summary
        label: Timeline preview text
        type: text
        description: "One or two sentences shown under the project when it is previewed on the home page timeline. Leave blank and the opening of the description is used instead."

      - name: date
        label: Date
        type: string
        description: "Shown on the timeline beneath the project — a year like 2024, or something like Spring 2023. Leave blank and a dash appears instead."

      - name: order
        label: Position on timeline
        type: number
        default: 1
        description: "Lower numbers appear first, left to right. This controls the sequence; the Date field is only the label, so set these to match your chronology."

      - name: accent
        label: Project colour
        type: select
        default: 1
        options:
          values:
            - { value: 1, label: "1 — Red" }
            - { value: 2, label: "2 — Blue" }
            - { value: 3, label: "3 — Green" }
            - { value: 4, label: "4 — Amber" }
            - { value: 5, label: "5 — Purple" }
            - { value: 6, label: "6 — Magenta" }
        description: This project's signature colour. It is the only colour on the site, so give each project a different one.

      - name: cover
        label: Cover image
        type: image
        description: The strongest render or photo. Export around 2400px wide as a JPG — full-size renders will make the page slow to load.

      - name: coverVideo
        label: Cover film
        type: string
        description: "Optional. Path to an MP4 already in assets/images, for example assets/images/my-project/film.mp4. Fill this in and the film plays in place of the cover image at the top of the project page — silent, looping, with the cover image as its still. The timeline and the work grid keep using the cover image. Typed as text on purpose: a file picker dropped this value on save."

      - name: coverVideoPoster
        label: Cover film still
        type: image
        description: "Optional, and only used with a Cover film. The frame shown before the film plays. Leave blank and the cover image is used, which is usually a different picture — a still taken from the film itself looks better."

      - name: type
        label: Type
        type: string
        description: e.g. Residential, Cultural, Institutional

      - name: year
        label: Year
        type: string
        description: "Used to order the timeline — newest first. Projects with no year sit after the dated ones."

      - name: location
        label: Location
        type: string
        description: "City or street. Shown in the bar of details under the cover image."

      - name: program
        label: Program
        type: text
        description: What the building is — e.g. "Single-family residence"

      - name: status
        label: Status
        type: string
        description: Built / Academic / Competition / Unbuilt

      - name: role
        label: Your role
        type: string
        description: e.g. "Solo academic project" or "Design lead, team of 4"

      - name: body
        label: Overview paragraphs
        type: rich-text
        options:
          format: markdown
          media: false
        list: true
        description: One paragraph per entry. Two to four short paragraphs is plenty — let the drawings carry the rest.

      - name: chapters
        label: Walkthrough chapters
        type: object
        list: true
        description: "Optional. Fill these in and the project page gains a walkthrough read in sequence, below the tabbed gallery. Used for the thesis; leave empty for everything else."
        fields:
          - name: title
            label: Chapter title
            type: string
            description: "Shown large at the top of the chapter, and in the sticky chapter bar."
          - name: standfirst
            label: Opening line
            type: text
            description: "One line under the title, set larger than the body."
          - name: body
            label: Paragraphs
            type: rich-text
            options:
              format: markdown
              media: false
            list: true
            description: "One paragraph per entry. These sit at the top of the chapter; text that belongs with particular figures goes in the block below instead."
          - name: stats
            label: Figures band
            type: object
            list: true
            description: "Optional. A row of large numbers with labels beneath — percentages, dates, quantities."
            fields:
              - { name: value, label: Number, type: string }
              - { name: label, label: Label, type: string }
          - name: list
            label: Bulleted list
            type: object
            description: "Optional. A titled list, laid out in columns."
            fields:
              - { name: title, label: List title, type: string }
              - { name: items, label: Items, type: string, list: true }
          - name: quote
            label: Pull quote
            type: object
            description: "Optional. A single line set large against the accent colour."
            fields:
              - { name: text, label: Quote, type: text }
              - { name: attribution, label: Attribution, type: string }
          - name: blocks
            label: Image blocks
            type: object
            list: true
            description: "Groups of images, each laid out a different way. Add as many as the chapter needs."
            fields:
              - name: kind
                label: Layout
                type: select
                default: grid
                description: "Wide runs one image the full measure of the page. Grid sets them two up."
                options:
                  values:
                    - { value: full, label: "Wide — the page's full measure, one per row" }
                    - { value: grid, label: "Grid — two up" }
              - name: title
                label: Strip heading
                type: string
                description: "Only used by strips. Shown small above the row."
              - name: text
                label: Paragraphs above these images
                type: rich-text
                options:
                  format: markdown
                  media: false
                list: true
                description: "Optional. Text that belongs with these particular figures rather than at the top of the chapter. One paragraph per entry."
              - name: images
                label: Images
                type: object
                list: true
                description: "The pictures in this block, in the order they should be read."
                fields:
                  - { name: src, label: Image, type: image }
                  - { name: caption, label: Caption, type: text }

          - name: images
            label: Loose images
            type: object
            list: true
            description: "Optional. Images not in a block; laid out two-up unless sized otherwise."
            fields:
              - { name: src, label: Image, type: image }
              - { name: caption, label: Caption, type: text }
              - name: size
                label: Size
                type: select
                default: normal
                options:
                  values:
                    - { value: wide, label: "Full width — plans, sections, key renders" }
                    - { value: normal, label: "Two-up — the default" }
                    - { value: small, label: "Small — a tertiary reference, never enlarged" }

      - name: galleryLead
        label: Opening tab
        type: select
        default: ""
        options:
          values:
            - ""
            - Views
            - Maps
            - Plans
            - Sections & Elevations
            - Diagrams
            - Data
            - Massing Exploration
            - Film
        description: "Optional. Which tab opens first. Leave blank for the usual order, starting with Views. The thesis leads with Diagrams."

      - name: gallery
        label: Gallery
        type: object
        list: true
        description: "Every picture on the project page. Each one needs a tab; give related drawings the same Building to group them under a subheading."
        fields:
          - name: src
            label: Image
            type: image
            description: "For a film entry this is the poster frame — the still shown before it plays."
          - name: video
            label: Film
            type: string
            description: "Optional. Path to an MP4 already in assets/images, for example assets/images/kensington-core/museum.mp4. Fill this in and the entry becomes a player instead of a picture, using the image above as its poster. Typed as text on purpose: a file picker dropped this value on save."
          - name: caption
            label: Caption
            type: text
            description: "Shown beneath the image. Also drives which tab it lands in, so name drawings plainly — \"Section\", \"Second Floor\", \"Massing Axon\"."
          - name: group
            label: Tab
            type: select
            default: Views
            options:
              values:
                - Views
                - Maps
                - Plans
                - Sections & Elevations
                - Diagrams
                - Data
                - Massing Exploration
                - Film
            description: "Which tab this image appears under. A project with only one tab's worth of images shows a plain grid instead."
          - name: building
            label: Building
            type: string
            description: "Optional. Groups drawings within a tab under a subheading — for example Housing, Garage, School. Leave blank if the project is a single structure."
          - name: wide
            label: Full width
            type: boolean
            default: false
            description: "Spans the full page width — suited to long sections and site plans. Leave off to sit two-up."
          - name: size
            label: Size
            type: select
            default: ""
            options:
              values:
                - { value: "", label: "Normal — two up" }
                - { value: small, label: "Small — packs four to a row, for serial studies" }
            description: "Set every image in a tab to Small and they lay out four to a row."

  # ---------------------------------------------------------------
  - name: research
    label: Research & writing
    type: collection
    path: content/research
    filename: "{fields.slug}.json"
    format: json
    view:
      fields: [title, kind, date, order, published]
      primary: title
      sort: [order, title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Shown in the Research list, at the top of the page, and in the browser tab."

      - name: published
        label: Show on site
        type: boolean
        default: true
        description: "Turn off to hide this piece. With nothing published, the Research link disappears from the navigation entirely."

      - name: slug
        label: URL name
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Lowercase letters, numbers and hyphens only.
        description: "Becomes the page address, under /research/."

      - name: kind
        label: Kind
        type: string
        description: "What this is — Research paper, Presentation, Essay, Thesis chapter. Shown in small type above the title."

      - name: date
        label: Date
        type: string
        description: "A year, or something like Spring 2021."

      - name: context
        label: Written for
        type: string
        description: "Optional. The course, institution or occasion. Shown after the kind and date."

      - name: order
        label: Position in the list
        type: number
        default: 1
        description: "Lower numbers appear first."

      - name: standfirst
        label: Opening line
        type: text
        description: "One sentence under the title, set larger than the body. A line from the piece itself works well."

      - name: summary
        label: Summary
        type: rich-text
        options:
          format: markdown
          media: false
        description: "Two or three sentences shown in the Research list. Say what the piece argues, not just what it is about."

      - name: topics
        label: Topics
        type: string
        list: true
        description: "A few keywords shown under the summary in the list."

      - name: pdf
        label: Original document
        type: file
        description: "Optional. The PDF, offered as a download at the top of the page for anyone who would rather read it that way."

      - name: sections
        label: Sections
        type: object
        list: true
        description: "The piece itself, in order. Give the first section a blank heading if it is an introduction."
        fields:
          - name: heading
            label: Section heading
            type: string
            description: "Leave blank for an untitled opening section."
          - name: blocks
            label: Blocks
            type: object
            list: true
            description: "Paragraphs, quotes and lists, in the order they should be read."
            fields:
              - name: kind
                label: Block type
                type: select
                default: text
                options:
                  values:
                    - { value: text, label: "Paragraphs" }
                    - { value: quote, label: "Block quote" }
                    - { value: list, label: "List" }
              - name: text
                label: Paragraphs
                type: rich-text
                options:
                  format: markdown
                  media: false
                list: true
                description: "Used by Paragraphs blocks. One paragraph per entry."
              - name: quoteText
                label: Quotation
                type: text
                description: "Used by Block quote blocks. Ignored by the others."
              - name: attribution
                label: Quotation source
                type: string
                description: "Optional. Shown under the quotation."
              - name: title
                label: List heading
                type: string
                description: "Optional, used by List blocks."
              - name: items
                label: List items
                type: string
                list: true
                description: "Used by List blocks. One entry per item; they lay out in columns."

      - name: references
        label: Work cited
        type: text
        list: true
        description: "One citation per entry. Shown as a numbered list at the foot of the page."

  # ---------------------------------------------------------------
  - name: settings
    label: Site settings
    type: string
    path: content/settings.json
    format: json
    fields:
      - name: site
        label: Site
        type: object
        description: "Your name and role, used in the header, the browser tab and the footer."
        fields:
          - { name: name, label: Your name, type: string }
          - name: role
            label: Discipline
            type: string
            description: "Shown after your name in the header — for example, Architecture."
          - { name: description, label: Search description, type: text, description: One sentence shown in Google results and link previews. }

      - name: landing
        label: Landing page
        type: object
        description: "The door before the site: a greeting, a line under it, and the button through."
        fields:
          - name: enabled
            label: Show landing page
            type: boolean
            default: true
            description: Turn off to send visitors straight to your work. All navigation links adjust automatically.
          - name: welcomeText
            label: Greeting
            type: string
            description: "The opening word. Always shown in black."
          - name: highlightText
            label: Your text
            type: string
            description: "Follows the greeting, in your chosen colour and bolder. Leave blank to show the greeting on its own."
          - name: highlightColor
            label: Colour of your text
            type: string
            pattern:
              regex: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
              message: Must be a hex colour such as #c8452b.
            description: "Colours your text only — the greeting and everything else stay black on white. Anything other than a hex value falls back to black."
          - name: subtitle
            label: Subtitle
            type: text
            description: "The line beneath."
          - { name: buttonLabel, label: Button text, type: string }
          - name: buttonDelaySeconds
            label: Button delay (seconds)
            type: number
            description: How long after the page loads before the button fades in.

      - name: home
        label: Home page
        type: object
        description: "The work page — the headline, the introduction, and the About teaser at the foot."
        fields:
          - name: layout
            label: How projects are shown
            type: select
            default: timeline
            options:
              values:
                - { value: timeline, label: "Timeline — scrolls sideways, cover fades in above" }
                - { value: grid, label: "Grid — all covers at once" }
          - { name: eyebrow, label: Small label above headline, type: string }
          - { name: headline, label: Headline, type: text }
          - name: intro
            label: Intro paragraph
            type: rich-text
            options:
              format: markdown
              media: false
            description: "The paragraph under the headline on the work page."
          - name: meta
            label: Quick facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
          - { name: aboutHeadline, label: About teaser headline, type: text, description: "The sentence over the About block at the foot of the work page." }
          - name: aboutSummary
            label: About teaser text
            type: rich-text
            options:
              format: markdown
              media: false
            description: "The paragraph in the About block at the foot of the work page."
          - { name: portrait, label: Portrait or studio photo, type: image }

      - name: about
        label: About page
        type: object
        description: "Everything on /about: the paragraphs, portrait, résumé, skills, history and references."
        fields:
          - name: paragraphs
            label: Biography
            type: rich-text
            options:
              format: markdown
              media: false
            list: true
            description: One paragraph per entry.
          - { name: portrait, label: Portrait photo, type: image }
          - { name: resume, label: Résumé PDF, type: file }
          - name: skills
            label: Skills
            type: object
            list: true
            fields:
              - { name: heading, label: Category, type: string }
              - { name: items, label: Items, type: string, list: true }
          - name: timeline
            label: Education & experience
            type: object
            list: true
            fields:
              - { name: year, label: Years, type: string }
              - { name: title, label: Title, type: string }
              - name: detail
                label: Detail
                type: rich-text
                options:
                  format: markdown
                  media: false
                description: "What the role or qualification involved. A sentence or two."

          - name: references
            label: References
            type: object
            list: true
            description: "Shown at the foot of the About page. These are other people's details on a public page — list only those who have agreed to it, and leave a field blank to keep it off the site."
            fields:
              - { name: name, label: Name, type: string }
              - { name: title, label: Title, type: string }
              - { name: organization, label: Organization, type: string }
              - { name: email, label: Email, type: string }
              - { name: phone, label: Phone, type: string, description: "Leave blank, or write 'On request', rather than publishing a number." }

      - name: guide
        label: "\"What brings you by?\""
        type: object
        description: "The short question above the timeline on the work page. A visitor picks an answer and gets a few sentences telling them where to look — nothing pops up, and the page reads normally if they ignore it."
        fields:
          - name: enabled
            label: Show the question
            type: boolean
            default: true
            description: Turn off to remove it from the work page entirely.
          - name: eyebrow
            label: Small label above
            type: string
            description: "A couple of words in grey — for example \"New here?\". Leave blank to show only the question."
          - name: question
            label: The question
            type: string
            description: "Keep it to one short line; it sits above the answer buttons."
          - name: routes
            label: Answers
            type: object
            list: true
            description: "Two or three works best — more and it stops reading as a quick choice. Each answer shows its own paragraph and links when clicked."
            fields:
              - name: label
                label: Button text
                type: string
                description: "What the visitor clicks — written as their own words, e.g. \"I'm hiring\". A few words at most."
              - name: blurb
                label: What to tell them
                type: rich-text
                options:
                  format: markdown
                  media: false
                description: "Two or three sentences pointing them at the right projects and saying why. This is the useful part — name things and give a reason, rather than just listing links."
              - name: links
                label: Links
                type: object
                list: true
                description: "Two or three shortcuts shown under the paragraph."
                fields:
                  - { name: label, label: Link text, type: string }
                  - name: href
                    label: Address
                    type: string
                    description: "Relative to the work page — for example projects/naugatuck.html, about.html or contact.html."

      - name: contact
        label: Contact page
        type: object
        description: "Everything on /contact, plus the email and links repeated in every page footer."
        fields:
          - { name: headline, label: Headline, type: text }
          - { name: email, label: Email, type: string, description: Leave blank to hide it from the site entirely. }
          - { name: phone, label: Phone, type: string, description: Leave blank to hide. }
          - { name: location, label: Location, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: footerCta, label: Footer message, type: text, description: "The line in the footer across the site." }

      - name: researchPage
        label: Research page
        type: object
        description: "The heading and introduction at the top of the Research list. The list itself is built from the Research & writing collection."
        fields:
          - name: headline
            label: Headline
            type: string
            description: 'Blank = "Research"'
          - name: intro
            label: Intro paragraph
            type: rich-text
            options:
              format: markdown
              media: false
            description: "Optional. One paragraph under the headline."

      - name: labels
        label: Headings & wording
        type: object
        description: "Every other word the site says for itself — section headings, buttons, the navigation. Leave any of these blank and the wording in its description is used, so you only need to fill in what you want to change."
        fields:
          - name: navWork
            label: "Navigation: Work"
            type: string
            description: 'Blank = "Work"'
          - name: navResearch
            label: "Navigation: Research"
            type: string
            description: 'Blank = "Research". Only shown when something is published in Research & writing.'
          - name: navAbout
            label: "Navigation: About"
            type: string
            description: 'Blank = "About"'
          - name: navContact
            label: "Navigation: Contact"
            type: string
            description: 'Blank = "Contact"'
          - name: navMenu
            label: "Navigation: menu button (small screens)"
            type: string
            description: 'Blank = "Menu"'

          - name: selectedWork
            label: Heading above the projects
            type: string
            description: 'Blank = "Selected Work"'
          - name: emptyWork
            label: Shown when no project is published
            type: text
            description: 'Blank = "No published projects yet."'

          - name: aboutEyebrow
            label: Small label on the About block
            type: string
            description: 'Blank = "About"'
          - name: aboutButton
            label: Button to the About page
            type: string
            description: 'Blank = "More about me →"'
          - name: resumeButton
            label: Résumé download button
            type: string
            description: 'Blank = "Download Résumé / CV ↓"'
          - name: skillsHeading
            label: Skills heading
            type: string
            description: 'Blank = "Software & Skills"'
          - name: experienceHeading
            label: Experience heading
            type: string
            description: 'Blank = "Education & Experience"'
          - name: referencesHeading
            label: References heading
            type: string
            description: 'Blank = "References"'
          - name: contactEyebrow
            label: Small label on the Contact page
            type: string
            description: 'Blank = "Contact"'

          - name: researchEyebrow
            label: Small label on the Research page
            type: string
            description: 'Blank = "Writing"'
          - name: researchHeading
            label: Research page heading
            type: string
            description: 'Blank = "Research"'
          - name: paperDownload
            label: Document download button
            type: string
            description: 'Blank = "Read the original PDF ↓"'
          - name: referencesListHeading
            label: Citations heading
            type: string
            description: 'Blank = "Work cited"'

          - name: overviewHeading
            label: Heading above a project's text
            type: string
            description: 'Blank = "Overview"'
          - name: prevProject
            label: Previous project link
            type: string
            description: 'Blank = "← Previous"'
          - name: nextProject
            label: Next project link
            type: string
            description: 'Blank = "Next →"'

          - name: backToTop
            label: Back-to-top link
            type: string
            description: 'Blank = "Back to top"'
          - name: footerContact
            label: Footer link to the Contact page
            type: string
            description: 'Blank = "Contact page →"'
          - name: footerLinkedin
            label: Footer LinkedIn link
            type: string
            description: 'Blank = "LinkedIn"'

