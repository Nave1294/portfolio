# Dashboard configuration for Pages CMS (app.pagescms.org).
# Defines what you see and can edit in the web dashboard. Saving in the
# dashboard commits to this repo, which triggers the build-and-deploy Action.

media:
  input: assets/images
  output: assets/images

content:
  # ---------------------------------------------------------------
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{fields.slug}.json"
    format: json
    view:
      fields: [title, type, year, published]
      primary: title
      sort: [order, title, year]
    fields:
      - name: title
        label: Project name
        type: string
        required: true

      - name: published
        label: Show on site
        type: boolean
        default: true
        description: Turn off to hide this project completely — no card, no page. Nothing else breaks; the previous/next links skip it automatically.

      - name: slug
        label: URL name
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Lowercase letters, numbers and hyphens only — for example "riverside-pavilion".
        description: Becomes the page address. Avoid changing it once you've shared a link to the project.

      - name: summary
        label: Timeline preview text
        type: text
        description: "One or two sentences shown under the project when it is previewed on the home page timeline. Leave blank and the opening of the description is used instead."

      - name: date
        label: Date
        type: string
        description: "Shown on the timeline beneath the project — a year like 2024, or something like Spring 2023. Leave blank and a dash appears instead."

      - name: order
        label: Position on timeline
        type: number
        default: 1
        description: "Lower numbers appear first, left to right. This controls the sequence; the Date field is only the label, so set these to match your chronology."

      - name: accent
        label: Project colour
        type: select
        default: 1
        options:
          values:
            - { value: 1, label: "1 — Red" }
            - { value: 2, label: "2 — Blue" }
            - { value: 3, label: "3 — Green" }
            - { value: 4, label: "4 — Amber" }
            - { value: 5, label: "5 — Purple" }
            - { value: 6, label: "6 — Magenta" }
        description: This project's signature colour. It is the only colour on the site, so give each project a different one.

      - name: cover
        label: Cover image
        type: image
        description: The strongest render or photo. Export around 2400px wide as a JPG — full-size renders will make the page slow to load.

      - name: type
        label: Type
        type: string
        description: e.g. Residential, Cultural, Institutional

      - name: year
        label: Year
        type: string

      - name: location
        label: Location
        type: string

      - name: program
        label: Program
        type: string
        description: What the building is — e.g. "Single-family residence"

      - name: status
        label: Status
        type: string
        description: Built / Academic / Competition / Unbuilt

      - name: role
        label: Your role
        type: string
        description: e.g. "Solo academic project" or "Design lead, team of 4"

      - name: body
        label: Overview paragraphs
        type: string
        list: true
        description: One paragraph per entry. Two to four short paragraphs is plenty — let the drawings carry the rest.

      - name: chapters
        label: Walkthrough chapters
        type: object
        list: true
        description: "Optional. Fill these in and the project page gains a walkthrough read in sequence, below the tabbed gallery. Used for the thesis; leave empty for everything else."
        fields:
          - name: title
            label: Chapter title
            type: string
          - name: standfirst
            label: Opening line
            type: string
            description: "One line under the title, set larger than the body."
          - name: body
            label: Paragraphs
            type: text
            list: true
          - name: stats
            label: Figures band
            type: object
            list: true
            description: "Optional. A row of large numbers with labels beneath — percentages, dates, quantities."
            fields:
              - { name: value, label: Number, type: string }
              - { name: label, label: Label, type: string }
          - name: list
            label: Bulleted list
            type: object
            description: "Optional. A titled list, laid out in columns."
            fields:
              - { name: title, label: List title, type: string }
              - { name: items, label: Items, type: string, list: true }
          - name: quote
            label: Pull quote
            type: object
            description: "Optional. A single line set large against the accent colour."
            fields:
              - { name: text, label: Quote, type: text }
              - { name: attribution, label: Attribution, type: string }
          - name: blocks
            label: Image blocks
            type: object
            list: true
            description: "Groups of images, each laid out a different way. Add as many as the chapter needs."
            fields:
              - name: kind
                label: Layout
                type: select
                default: grid
                options:
                  values:
                    - { value: full, label: "Wide — the page's full measure, one per row" }
                    - { value: grid, label: "Grid — two up" }
              - name: title
                label: Strip heading
                type: string
                description: "Only used by strips. Shown small above the row."
              - name: text
                label: Paragraphs above these images
                type: string
                list: true
                description: "Optional. Text that belongs with these particular figures rather than at the top of the chapter. One paragraph per entry."
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image }
                  - { name: caption, label: Caption, type: string }

          - name: images
            label: Loose images
            type: object
            list: true
            description: "Optional. Images not in a block; laid out two-up unless sized otherwise."
            fields:
              - { name: src, label: Image, type: image }
              - { name: caption, label: Caption, type: string }
              - name: size
                label: Size
                type: select
                default: normal
                options:
                  values:
                    - { value: wide, label: "Full width — plans, sections, key renders" }
                    - { value: normal, label: "Two-up — the default" }
                    - { value: small, label: "Small — a tertiary reference, never enlarged" }

      - name: galleryLead
        label: Opening tab
        type: select
        default: ""
        options:
          values:
            - ""
            - Views
            - Maps
            - Plans
            - Sections & Elevations
            - Diagrams
        description: "Optional. Which tab opens first. Leave blank for the usual order, starting with Views. The thesis leads with Diagrams."

      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
          - name: caption
            label: Caption
            type: string
            description: "Shown beneath the image. Also drives which tab it lands in, so name drawings plainly — \"Section\", \"Second Floor\", \"Massing Axon\"."
          - name: group
            label: Tab
            type: select
            default: Views
            options:
              values:
                - Views
                - Maps
                - Plans
                - Sections & Elevations
                - Diagrams
            description: "Which tab this image appears under. A project with only one tab's worth of images shows a plain grid instead."
          - name: building
            label: Building
            type: string
            description: "Optional. Groups drawings within a tab under a subheading — for example Housing, Garage, School. Leave blank if the project is a single structure."
          - name: wide
            label: Full width
            type: boolean
            default: false
            description: "Spans the full page width — suited to long sections and site plans. Leave off to sit two-up."

  # ---------------------------------------------------------------
  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: site
        label: Site
        type: object
        fields:
          - { name: name, label: Your name, type: string }
          - name: role
            label: Discipline
            type: string
            description: "Shown after your name in the header — for example, Architecture."
          - { name: description, label: Search description, type: text, description: One sentence shown in Google results and link previews. }

      - name: landing
        label: Landing page
        type: object
        fields:
          - name: enabled
            label: Show landing page
            type: boolean
            default: true
            description: Turn off to send visitors straight to your work. All navigation links adjust automatically.
          - name: welcomeText
            label: Greeting
            type: string
            description: "The opening word. Always shown in black."
          - name: highlightText
            label: Your text
            type: string
            description: "Follows the greeting, in your chosen colour and bolder. Leave blank to show the greeting on its own."
          - name: highlightColor
            label: Colour of your text
            type: string
            pattern:
              regex: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
              message: Must be a hex colour such as #c8452b.
            description: "Colours your text only — the greeting and everything else stay black on white. Anything other than a hex value falls back to black."
          - name: subtitle
            label: Subtitle
            type: string
            description: "The line beneath."
          - { name: buttonLabel, label: Button text, type: string }
          - name: buttonDelaySeconds
            label: Button delay (seconds)
            type: number
            description: How long after the page loads before the button fades in.

      - name: home
        label: Home page
        type: object
        fields:
          - name: layout
            label: How projects are shown
            type: select
            default: timeline
            options:
              values:
                - { value: timeline, label: "Timeline — scrolls sideways, cover fades in above" }
                - { value: grid, label: "Grid — all covers at once" }
          - { name: eyebrow, label: Small label above headline, type: string }
          - { name: headline, label: Headline, type: text }
          - { name: intro, label: Intro paragraph, type: text }
          - name: meta
            label: Quick facts
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
          - { name: aboutHeadline, label: About teaser headline, type: string }
          - { name: aboutSummary, label: About teaser text, type: text }
          - { name: portrait, label: Portrait or studio photo, type: image }

      - name: about
        label: About page
        type: object
        fields:
          - name: paragraphs
            label: Biography
            type: text
            list: true
            description: One paragraph per entry.
          - { name: portrait, label: Portrait photo, type: image }
          - { name: resume, label: Résumé PDF, type: file }
          - name: skills
            label: Skills
            type: object
            list: true
            fields:
              - { name: heading, label: Category, type: string }
              - { name: items, label: Items, type: string, list: true }
          - name: timeline
            label: Education & experience
            type: object
            list: true
            fields:
              - { name: year, label: Years, type: string }
              - { name: title, label: Title, type: string }
              - { name: detail, label: Detail, type: string }

      - name: contact
        label: Contact page
        type: object
        fields:
          - { name: headline, label: Headline, type: text }
          - { name: email, label: Email, type: string, description: Leave blank to hide it from the site entirely. }
          - { name: phone, label: Phone, type: string, description: Leave blank to hide. }
          - { name: location, label: Location, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: footerCta, label: Footer message, type: string, description: The line in the footer across the site. }
